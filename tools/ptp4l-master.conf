# linuxptp (>= 4.0) configuration: this PC as PTP grandmaster for the board.
# Used by tools/ptp_master.sh; see README.md "Precise time (PTP)".
#
# Matches what the firmware's slave (Core/Src/ptp.c) speaks: PTPv2 over
# UDP/IPv4 multicast, end-to-end delay mechanism, domain 0, two-step.

[global]
# Never become a slave to anything else on this link.
serverOnly              1
domainNumber            0
network_transport       UDPv4
delay_mechanism         E2E
time_stamping           hardware

# 64 Sync/s, up to 8 Delay_Req/s. The stock NUCLEO has no HSE crystal, so
# the board runs off its HSI RC oscillator, which wanders by tens of ppm
# within a second; the residual error is roughly that wander times the Sync
# interval, so Syncs are sent as often as is practical (~8 KB/s). The path
# delay is constant on a direct cable, so Delay_Req can stay slower.
logSyncInterval         -6
logMinDelayReqInterval  -3
logAnnounceInterval     0

# TAI - UTC, announced to the board so it can convert.
utc_offset              37
